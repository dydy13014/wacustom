[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wastream"
version = "1.0.0"
description = "Stremio addon to convert DDL to streams via debrid services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn>=0.52,<1.0",
    # selectolax 1.0 a supprimé le moteur Modest (selectolax.parser) : borné
    # sous 1.0 tant que le code n'est pas migré vers selectolax.lexbor
    "selectolax>=0.4.11,<1.0",
    "httpx>=0.28,<1.0",
    "databases>=0.9,<1.0",
    "aiosqlite>=0.22,<1.0",
    "asyncpg>=0.31,<1.0",
    "pydantic-settings>=2.15,<3",
    "loguru>=0.7,<1.0",
    "pycryptodome>=3.23,<4",
    "bcrypt>=5.0,<6",
    "psutil>=7.2,<8",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wastream*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
